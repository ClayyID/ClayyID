name: Build ClayyID APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ClayyID-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Extract project
        run: |
          unzip -o ClayyID-Android-Source.zip -d .
          test -f ClayyID-Android/app/build.gradle
          sed -i 's/android:gravity="fitCenter"/android:gravity="center"/g' ClayyID-Android/app/src/main/res/drawable/splash_background.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ClayyID-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClayyID-debug-APK
          path: ClayyID-Android/app/build/outputs/apk/debug/app-debug.apk
